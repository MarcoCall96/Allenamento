<body>
  <div class="device-frame">
  <div class="app-shell">
    <header class="topbar">
      <div class="brand">
        <div id="profile-control" class="profile-control"></div>
        <div><span class="brand-kicker">IL TUO ALLENAMENTO</span><strong>Allenamento<span class="brand-dot">.</span></strong></div>
      </div>
    </header>
    <div class="scroll-content">
    <div id="notice" class="notice" role="status" aria-live="polite" hidden></div>
    <main id="main-content">
      <section id="view-home" class="view" aria-label="Home"></section>
      <section id="view-workout" class="view" aria-label="Allenamento" hidden></section>
      <section id="view-plan" class="view" aria-label="Modifica scheda" hidden></section>
      <section id="view-history" class="view" aria-label="Storico" hidden></section>
      <section id="view-more" class="view" aria-label="Altro" hidden></section>
      <noscript><p class="notice notice-error">Attiva JavaScript per utilizzare l'app.</p></noscript>
    </main>
    </div>

    <div id="rest-timer-dock" class="rest-timer-dock" role="region" aria-label="Timer recupero" hidden>
      <div class="rest-timer-detail">
        <span class="rest-timer-label">RECUPERO</span>
        <strong id="rest-timer-value" class="rest-timer-value">--:--</strong>
        <span id="rest-timer-status" class="rest-timer-status">Seleziona un esercizio</span>
      </div>
      <div class="rest-timer-actions">
        <button id="rest-timer-back" type="button" class="timer-control timer-step" aria-label="Meno 10 secondi">−10</button>
        <button id="rest-timer-toggle" type="button" class="timer-control timer-play" aria-label="Avvia timer">▶</button>
        <button id="rest-timer-forward" type="button" class="timer-control timer-step" aria-label="Più 10 secondi">+10</button>
        <button id="rest-timer-reset" type="button" class="timer-control" aria-label="Azzera timer">↺</button>
      </div>
    </div>

    <nav class="bottom-nav" aria-label="Navigazione principale">
      <button type="button" class="nav-item is-active" data-screen="home" aria-current="page">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M3.5 10.5 12 3.8l8.5 6.7V20H14v-5H10v5H3.5v-9.5Z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span>Home</span>
      </button>
      <button type="button" class="nav-item" data-screen="workout">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M5 8v8M2.5 9.5v5M19 8v8M21.5 9.5v5M5 12h14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        <span>Allenamento</span>
      </button>
      <button type="button" class="nav-item" data-screen="history">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="8" stroke="currentColor" stroke-width="1.8"/><path d="M12 7.5v4.8l3 2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span>Storico</span>
      </button>
      <button type="button" class="nav-item" data-screen="more">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="6" cy="12" r="1.6" fill="currentColor"/><circle cx="12" cy="12" r="1.6" fill="currentColor"/><circle cx="18" cy="12" r="1.6" fill="currentColor"/></svg>
        <span>Altro</span>
      </button>
    </nav>
  </div>
  </div>
